<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dofus Retro (Ruffle)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #flashContainer { width: 100%; height: 100%; }
    #flashGame, ruffle-player { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="flashContainer"></div>

  <!-- Ruffle web, copie de node_modules/@ruffle-rs/ruffle dans ./ruffle -->
  <script src="ruffle/ruffle.js"></script>
  <script>
  'use strict';

  // -------------------------------------------------------------------------
  // 1. Stubs du pont ExternalInterface, memes noms que D1ElectronLauncher.js.
  //    Chaque appel est logge avec ses arguments pour comprendre le protocole.
  // -------------------------------------------------------------------------
  const NULL = '|null|';                 // valeur "null" attendue par le SWF
  const trace = (name, args, ret) => {
    console.log(`[EI] ${name}(`, ...args, `) ->`, ret);
    return ret;
  };
  const stub = (name, ret) => (...args) => trace(name, args, typeof ret === 'function' ? ret(...args) : ret);

  const clientDir = new URLSearchParams(location.search).get('client') || '.';

  // Lecture des fichiers "userData/Flash Client Resources/<nom>" : pour le
  // test on lit dans le dossier retroclient servi en local (config.xml, etc.)
  async function fetchText(rel) {
    try {
      const r = await fetch('http://localhost:8000/' + rel);
      return r.ok ? (await r.text()).replace(/^\uFEFF/, '') : NULL;
    } catch (e) { return NULL; }
  }
  // ExternalInterface est synchrone : on precharge les fichiers connus.
  const preloaded = {};
  const PRELOAD = ['config.xml', 'loadingbanners.xml'];

  Object.assign(window, {
    // --- Versions / environnement ---
    getElectronVersion: stub('getElectronVersion', 'ruffle-shell'),
    getNodejsVersion:   stub('getNodejsVersion', 'ruffle-shell'),
    getLanguage:        stub('getLanguage', 'fr'),
    getCurrentDate:     stub('getCurrentDate', () => new Date().toISOString().slice(0, 10)),
    getYesterdayDate:   stub('getYesterdayDate', () => new Date(Date.now() - 864e5).toISOString().slice(0, 10)),
    getUserDataTextFileContent: stub('getUserDataTextFileContent', (name) => preloaded[name] ?? NULL),
    hasSystemInformations: stub('hasSystemInformations', false),
    getSystemInformation:  stub('getSystemInformation', NULL),
    getZaapHash:        stub('getZaapHash', ''),

    // --- Cycle de vie ---
    setInitialized:     stub('setInitialized'),
    changeTitle:        stub('changeTitle', (t) => { document.title = t; }),
    showMenuBar:        stub('showMenuBar'),
    closeGame:          stub('closeGame', () => window.close()),
    closeBrowserWindow: stub('closeBrowserWindow', () => window.close()),
    reloadBrowserWindow:stub('reloadBrowserWindow', () => location.reload()),
    setLanguage:        stub('setLanguage'),
    setOption:          stub('setOption'),

    // --- Logs / chat / console (cosmetique) ---
    consoleLog:   stub('consoleLog'),
    consolePrint: stub('consolePrint'),
    chatLog:      stub('chatLog'),
    chatPrint:    stub('chatPrint'),
    userLog:      stub('userLog'),
    debugRequest: stub('debugRequest'),
    makeNotification: stub('makeNotification'),
    retroChatOpen: stub('retroChatOpen'), retroConsoleOpen: stub('retroConsoleOpen'),
    retroChatClear: stub('retroChatClear'), retroConsoleClear: stub('retroConsoleClear'),
    retroChatRefresh: stub('retroChatRefresh'), retroChatSetPrefix: stub('retroChatSetPrefix'),
    retroChatInsertPromptText: stub('retroChatInsertPromptText'),
    retroChatSetPromptText: stub('retroChatSetPromptText'),
    retroConsoleSetPromptText: stub('retroConsoleSetPromptText'),
    retroConsoleSetHeaderLabel: stub('retroConsoleSetHeaderLabel'),
    setWidescreenEnabled: stub('setWidescreenEnabled'),
    getWidescreenPanelId: stub('getWidescreenPanelId', 0),
    setWidescreenPanelId: stub('setWidescreenPanelId'),
    isShowingWidescreenPanel: stub('isShowingWidescreenPanel', false),
    focusWidescreenPanelIfPossible: stub('focusWidescreenPanelIfPossible'),
    setIngameDiscordActivity: stub('setIngameDiscordActivity'),
    setLoginDiscordActivity:  stub('setLoginDiscordActivity'),
    eventData: stub('eventData'),
    modReportsMergeDayReportsDocs: stub('modReportsMergeDayReportsDocs'),
    modReportsPrintPendingReports: stub('modReportsPrintPendingReports'),
    modReportsSendDayReportsDocs: stub('modReportsSendDayReportsDocs'),
    makeReport: stub('makeReport'),

    // --- Utilitaires purs (reimplementes tels quels) ---
    stripHtml: (html) => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; },
    escapeXml: (s) => s.replace(/[<>&'"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;' }[c])),

    // --- Authentification Zaap (main.jsc) : A REIMPLEMENTER ---
    zaapConnect:      stub('zaapConnect'),
    zaapAksAuthToken: stub('zaapAksAuthToken'),

    // --- Securite / anticheat (main.jsc) : A REIMPLEMENTER ---
    getHash:          stub('getHash'),
    getTelemetry:     stub('getTelemetry'),
    getRandomNetworkKey: stub('getRandomNetworkKey', ''),
    applyPacketToSendPostProcessing: stub('applyPacketToSendPostProcessing', (p) => p), // identite
    onPacketSent:     stub('onPacketSent'),
    onPacketReceived: stub('onPacketReceived'),
    parseActivityRequest:    stub('parseActivityRequest', NULL),
    getActivityResultPacket: stub('getActivityResultPacket', NULL),
  });

  // -------------------------------------------------------------------------
  // 2. Ruffle : socketProxy relaie XMLSocket -> notre pont WS/TCP (main.js).
  //    Ajoute ici les couples host/port vus dans `lsof` sur le vrai client.
  // -------------------------------------------------------------------------
  const SOCKETS = [
    { host: '127.0.0.1', port: 26117 },   // Ankama Launcher (Zaap)
    // { host: '<ip-login>', port: 443 },
    // { host: '<ip-jeu>',   port: 5555 },
  ];

  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: 'on',
    allowScriptAccess: true,
    allowNetworking: 'all',
    logLevel: 'info',
    socketProxy: SOCKETS.map((s) => ({ ...s, proxyUrl: `ws://localhost:8765/${s.host}/${s.port}` })),
  };

  window.addEventListener('DOMContentLoaded', async () => {
    for (const f of PRELOAD) preloaded[f] = await fetchText(f);

    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    player.id = 'flashGame';                       // le JS d'Ankama cible #flashGame
    document.getElementById('flashContainer').appendChild(player);
    player.addEventListener('loadedmetadata', () => console.log('[ruffle] SWF loaded'));
    const BASE = 'http://localhost:8000/';
    await player.load({
      url: BASE + 'preloader.swf',
      parameters: { electron: 'yes' },
      base: BASE,          // resout loader.swf, clips/, data/ ... au bon endroit
    });
  });
  </script>
</body>
</html>
